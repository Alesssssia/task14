server {
    listen 8080;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    root /usr/share/nginx/html;

    location / {
        index index.html;
    }

    location /secondpage/ {
        index secondpage.html;
    }

    location /music {
        try_files /music/song.mp3 =404;
        add_header Content-Disposition "attachment; filename=\"song.mp3\"";
    }

    location ~ \.php$ {
        proxy_pass http://apache:8081;
        proxy_set_header Host $host; # ИЗМЕНЕНО: убран бэкслеш \$
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /secondserver {
        proxy_pass http://httpbin.org/html;
    }

    location /image1 {
        root /usr/share/nginx/html;
    }

    location ~ ^/image2/(.*\.png)$ {
        proxy_pass http://apache:8081/rotate.php?image=$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
